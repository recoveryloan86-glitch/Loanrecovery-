<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samvitloan  - Payment</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
background:#f3f6fb;
font-family:Arial,Helvetica,sans-serif;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
color:#111827
}

.card{
width:100%;
max-width:430px;
background:white;
border-radius:18px;
padding:25px 22px;
box-shadow:0 8px 28px rgba(0,0,0,.10)
}

.logo{
text-align:center;
font-size:30px;
font-weight:800;
color:#1769e0;
margin-bottom:5px
}

.subtitle{
text-align:center;
font-size:15px;
color:#666;
margin-bottom:18px
}

.info{
background:#f8fafc;
border:1px solid #e5e7eb;
border-radius:12px;
padding:15px;
margin-bottom:15px
}

.row{
font-size:16px;
font-weight:700;
margin:8px 0
}

.amount{
color:#20a548;
font-size:24px
}

.expiry{
text-align:center;
color:#d33f4b;
font-size:16px;
font-weight:700;
margin:14px 0
}

.expired{
display:none;
text-align:center;
color:#d33f4b;
font-weight:700;
margin:14px 0
}

#qrcode{
display:flex;
justify-content:center;
margin:12px auto 18px
}

#qrcode img{
width:175px;
height:175px;
padding:5px;
background:white;
border:1px solid #ddd;
border-radius:10px
}

.upibox{
display:flex;
align-items:center;
background:#e9edf2;
border-radius:10px;
overflow:hidden;
margin-bottom:12px
}

.upiid{
padding:12px;
font-size:15px;
flex:1;
word-break:break-all
}

.copy{
border:0;
background:#1769e0;
color:white;
padding:12px 15px;
font-weight:700;
cursor:pointer
}

.pay{
display:block;
width:100%;
text-align:center;
text-decoration:none;
background:#20a548;
color:white;
border-radius:10px;
padding:14px;
font-size:18px;
font-weight:700
}

.note{
text-align:center;
color:#777;
font-size:11px;
margin-top:13px
}

@media(max-width:450px){
.card{padding:22px 17px}
#qrcode img{width:175px;height:175px}
}
</style>
</head>

<body>

<div class="card">

<div class="logo" id="appName">Samvitloan</div>

<div class="subtitle">Secure UPI Payment Request</div>

<div class="info">

<div class="row">
Customer Name:
<span id="customerName">Santosh vilasrao dahitule</span>
</div>

<div class="row">
Amount:
<span class="amount">₹<span id="amount">11800</span></span>
</div>

</div>

<div class="expiry" id="expiryText">
Link expires in: <span id="timer">10:00</span>
</div>

<div class="expired" id="expiredText">
This payment link has expired.
</div>

<div id="qrcode"></div>

<div class="upibox">

<div class="upiid" id="upiText">7004738614@mbk</div>

<button class="copy" onclick="copyUPI()">Copy UPI</button>

</div>

<a id="payButton" class="pay">
Pay Now via UPI
</a>

<div class="note">
Please verify the recipient details before making payment.
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

const DEFAULTS={
appName:"samvitloan",
upi:"7004738614@mbk",
customerName:"santosh vilasrao dahitule",
amount:"11800",
expiryMinutes:10
};

const params=new URLSearchParams(window.location.search);

const appName=params.get("app")||DEFAULTS.appName;
const upi=params.get("upi")||DEFAULTS.upi;
const customerName=params.get("name")||DEFAULTS.customerName;
const amount=params.get("amount")||DEFAULTS.amount;
const expiryMinutes=parseInt(params.get("minutes"))||DEFAULTS.expiryMinutes;

document.getElementById("appName").textContent=appName;
document.getElementById("customerName").textContent=customerName;
document.getElementById("amount").textContent=Number(amount).toLocaleString("en-IN");
document.getElementById("upiText").textContent=upi;

const upiURL=
"upi://pay"+
"?pa="+encodeURIComponent(upi)+
"&pn="+encodeURIComponent(appName)+
"&am="+encodeURIComponent(amount)+
"&cu=INR"+
"&tn="+encodeURIComponent("Payment for "+customerName);

new QRCode(document.getElementById("qrcode"),{
text:upiURL,
width:175,
height:175,
correctLevel:QRCode.CorrectLevel.H
});

document.getElementById("payButton").href=upiURL;

function copyUPI(){
navigator.clipboard.writeText(upi).then(function(){
const button=document.querySelector(".copy");
button.textContent="Copied!";

setTimeout(function(){
button.textContent="Copy UPI";
},1500);
});
}

let seconds=expiryMinutes*60;

const timer=document.getElementById("timer");
const expiryText=document.getElementById("expiryText");
const expiredText=document.getElementById("expiredText");
const payButton=document.getElementById("payButton");
const qrcode=document.getElementById("qrcode");

function updateTimer(){

let minutes=Math.floor(seconds/60);
let remainingSeconds=seconds%60;

timer.textContent=
String(minutes).padStart(2,"0")+":"+
String(remainingSeconds).padStart(2,"0");

if(seconds<=0){

clearInterval(countdown);

expiryText.style.display="none";
expiredText.style.display="block";

payButton.style.pointerEvents="none";
payButton.style.opacity="0.5";

qrcode.style.opacity="0.35";

return;
}

seconds--;
}

updateTimer();

const countdown=setInterval(updateTimer,1000);

</script>

</body>
</html>
